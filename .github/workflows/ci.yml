name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build generated plugins
        run: bash build/build.sh

      - name: Check tracked generated files
        run: git diff --exit-code -- claude codex

      - name: Check untracked generated files
        run: test -z "$(git status --porcelain --untracked-files=all -- claude codex)"

      - name: Verify Adaptive Assurance shadow-disabled control
        run: |
          python tools/adaptive_assurance_study.py prepare-control \
            --repo . \
            --workspace "$RUNNER_TEMP/adaptive-assurance-study-control" \
            > "$RUNNER_TEMP/adaptive-assurance-control-prepare.json"
          python tools/adaptive_assurance_study.py verify-control \
            --workspace "$RUNNER_TEMP/adaptive-assurance-study-control" \
            > "$RUNNER_TEMP/adaptive-assurance-control-verify.json"
          cmp \
            "$RUNNER_TEMP/adaptive-assurance-control-prepare.json" \
            "$RUNNER_TEMP/adaptive-assurance-control-verify.json"

      - name: Run all unit tests
        run: python -m unittest discover -s tests -v

      - name: Check whitespace errors
        run: git diff --check
