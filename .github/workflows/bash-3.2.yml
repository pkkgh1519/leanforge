name: Bash 3.2 compatibility

on:
  pull_request:
  push:
    branches: [main]

jobs:
  bash-3-2:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify actual Bash 3.2
        shell: bash
        run: |
          set -euo pipefail
          /bin/bash --version
          case "$(/bin/bash -c 'printf %s "$BASH_VERSION"')" in
            3.2.*) ;;
            *) echo "expected /bin/bash 3.2" >&2; exit 1 ;;
          esac

      - name: Build with Bash 3.2
        shell: bash
        run: /bin/bash build/build.sh

      - name: Run focused build and split contracts
        shell: bash
        run: >-
          python -m unittest
          tests.test_run_orchestration_blocks
          tests.test_release_consistency -v

      - name: Check generated and whitespace drift
        shell: bash
        run: |
          git diff --exit-code -- claude codex
          test -z "$(git status --porcelain --untracked-files=all -- claude codex)"
          git diff --check
