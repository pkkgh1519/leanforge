name: Temporary ChatGPT Leanforge Export

on:
  pull_request:
    branches:
      - 'Leanforge/v1.9.0-contract-foundation'
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  export-bundle:
    if: github.head_ref == 'chatgpt-export-leanforge-v1.9.0'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact base revision with full history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Create and verify full Git bundle
        shell: bash
        run: |
          set -euo pipefail
          git bundle create "$RUNNER_TEMP/leanforge-v1.9.0.bundle" --all
          git bundle verify "$RUNNER_TEMP/leanforge-v1.9.0.bundle"
          git bundle list-heads "$RUNNER_TEMP/leanforge-v1.9.0.bundle" > "$RUNNER_TEMP/leanforge-v1.9.0.bundle-heads.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/leanforge-v1.9.0.checked-out-head.txt"

      - name: Upload repository bundle
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-leanforge-v1.9.0-bundle
          path: |
            ${{ runner.temp }}/leanforge-v1.9.0.bundle
            ${{ runner.temp }}/leanforge-v1.9.0.bundle-heads.txt
            ${{ runner.temp }}/leanforge-v1.9.0.checked-out-head.txt
          if-no-files-found: error
          retention-days: 1
